name: Base de données Neon

# Migration manuelle : aucun déclenchement automatique, aucun secret dans le dépôt.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez MIGRER pour appliquer les migrations Alembic"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    name: Vérifier et migrer PostgreSQL
    if: ${{ inputs.confirmation == 'MIGRER' }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Refuser si le secret DATABASE_URL est absent
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::Ajoutez le secret repository DATABASE_URL avant de lancer ce workflow."
          exit 1

      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Dépendances API
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt

      - name: Vérification de la connexion
        env:
          PYTHONPATH: services/api
        run: |
          source .venv/bin/activate
          python -m app.ops.db_check

      - name: Migrations Alembic
        env:
          PYTHONPATH: services/api
        run: |
          source .venv/bin/activate
          python -m alembic -c services/api/alembic.ini upgrade head
